name: CI

on: [push, pull_request]

# Cancel in-progress runs for the same ref (rapid pushes to a branch/PR).
#concurrency:
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: true

# Minimal token permissions.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --system --only-binary grpcio,grpcio-tools -r requirements.txt coverage

      - name: Generate protobuf interfaces
        run: python .github/scripts/generate_protobuf.py

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m

  unit-test-examples:
    name: Unit test examples (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.x' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: example-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: examples-py${{ matrix.python-version }}-${{ matrix.os }}

      - name: Install core and example dependencies
        run: uv pip install --python "${{ steps.example-python.outputs.python-path }}" --only-binary grpcio,grpcio-tools -r requirements.txt -r requirements_examples.txt

      - name: Generate protobuf interfaces
        run: uv run --no-project --python "${{ steps.example-python.outputs.python-path }}" python .github/scripts/generate_protobuf.py

      - name: Run example unit tests
        run: uv run --no-project --python "${{ steps.example-python.outputs.python-path }}" python -m unittest discover -s tests/examples -p "test_*.py"

  latest-python-probe:
    name: Latest Python probe (${{ matrix.os }})
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: latest-${{ matrix.os }}

      - name: Check gRPC binary wheels
        id: wheel-check
        continue-on-error: true
        run: uv pip install --system --dry-run --only-binary grpcio,grpcio-tools -r requirements.txt coverage

      - name: Explain skipped latest Python probe
        if: steps.wheel-check.outcome != 'success'
        run: echo "::warning title=Latest Python probe skipped::Python 3.x has no required gRPC wheels on ${{ matrix.os }}; probe skipped. Stable checks continue."

      - name: Install dependencies
        if: steps.wheel-check.outcome == 'success'
        run: uv pip install --system --only-binary grpcio,grpcio-tools -r requirements.txt coverage

      - name: Generate protobuf interfaces
        if: steps.wheel-check.outcome == 'success'
        run: python .github/scripts/generate_protobuf.py --include-custom

      - name: Run unit and integration tests
        if: steps.wheel-check.outcome == 'success'
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          if [[ "${{ matrix.os }}" != ubuntu-22.04-arm && "${{ matrix.os }}" != ubuntu-24.04-arm ]]; then
            python tests/integration/run_integration_tests.py
          fi
          coverage report -m

  integration-test:
    name: Integration test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}-${{ matrix.os }}

      - name: Install dependencies
        run: uv pip install --system --only-binary grpcio,grpcio-tools -r requirements.txt

      - name: Generate protobuf interfaces
        run: python .github/scripts/generate_protobuf.py --include-custom

      - name: Run integration tests
        run: python tests/integration/run_integration_tests.py

  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements_dev.txt

      - name: Generate protobuf interfaces
        run: python .github/scripts/generate_protobuf.py --include-custom

      - name: Run Pylint
        run: pylint --jobs=1 pookiepy tests examples
