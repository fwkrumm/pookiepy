name: CLI Skeleton Smoke

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Skeletons (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: skeleton-py${{ matrix.python-version }}-${{ matrix.os }}

      - name: Create isolated environment
        run: |
          venv_dir="$RUNNER_TEMP/pookiepy-skeleton-venv"
          uv venv "$venv_dir" --python python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            venv_python="$venv_dir/Scripts/python.exe"
          else
            venv_python="$venv_dir/bin/python"
          fi
          echo "POOKIEPY_VENV_PYTHON=$venv_python" >> "$GITHUB_ENV"

      - name: Install pookiepy from checkout
        run: uv pip install --python "$POOKIEPY_VENV_PYTHON" "$GITHUB_WORKSPACE"

      - name: Generate and run every skeleton
        working-directory: ${{ runner.temp }}
        run: >-
          "$POOKIEPY_VENV_PYTHON"
          "$GITHUB_WORKSPACE/.github/scripts/cli_skeleton_smoke.py"
          --project-root "$GITHUB_WORKSPACE"
