name: CLI Skeleton Smoke

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Skeletons (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.x' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14", "3.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup
        uses: $/.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: skeleton-py${{ matrix.python-version }}-${{ matrix.os }}

      - name: Create isolated environment
        env:
          UV_PYTHON: ${{ steps.setup.outputs.python-path }}
        run: bash .github/scripts/create_smoke_environment.sh

      - name: Install pookiepy from checkout
        id: dependencies
        uses: $/.github/actions/install-dependencies
        with:
          python-path: ${{ env.POOKIEPY_VENV_PYTHON }}
          probe: ${{ matrix.python-version == '3.x' }}
          requirements: ''
          packages: ${{ github.workspace }}

      - name: Generate and run every skeleton
        if: steps.dependencies.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}
        env:
          UV_PYTHON: ${{ env.POOKIEPY_VENV_PYTHON }}
        run: >-
          uv run --no-project python
          "$GITHUB_WORKSPACE/.github/scripts/cli_skeleton_smoke.py"
          --project-root "$GITHUB_WORKSPACE"

      - name: Report latest Python probe failure
        if: failure() && matrix.python-version == '3.x'
        env:
          UV_PYTHON: ${{ steps.setup.outputs.python-path }}
        run: uv run --no-project python .github/scripts/report_probe.py failed
