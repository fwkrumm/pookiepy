name: Publish to PyPI

on:
  push:
    branches:
      - master

# Minimal token permissions.
# id-token: write is required for PyPI Trusted Publishing (OIDC --- no stored secrets needed).
permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    # The 'pypi-release' environment can require manual approval before publishing.
    environment: pypi-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install grpcio-tools for proto generation
        run: uv pip install --system --only-binary grpcio-tools grpcio-tools

      - name: Generate proto
        run: python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. --pyi_out=. grpchook/message.proto

      - name: Build distribution packages (sdist + wheel)
        run: uv build

      - name: Publish to PyPI via Trusted Publishing
        # Uses OIDC --- no PYPI_API_TOKEN secret required.
        # Configure the trusted publisher once at:
        # https://pypi.org/manage/project/<your-package>/settings/publishing/
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # repository-url: https://test.pypi.org/legacy/ # for testing
          skip_existing: true

      - name: Read version from root __init__.py
        id: version
        if: success() && github.ref_name == 'master'
        run: |
          VERSION="$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path('__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*[\"\']([^\"\']+)[\"\']\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find __version__ in __init__.py')
          print(match.group(1))
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: success() && github.ref_name == 'master'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git fetch --tags

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            HEAD_SHA="$(git rev-parse HEAD)"

            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to this commit; nothing to do."
              exit 0
            fi

            echo "Tag ${TAG} already exists on a different commit (${TAG_SHA}); refusing to move it."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
