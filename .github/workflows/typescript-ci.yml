name: TypeScript CI

on:
  push:
    paths:
      - ".typescript/**"
      - "pookiepy/message.proto"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    paths:
      - ".typescript/**"
      - "pookiepy/message.proto"
      - ".github/workflows/typescript-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: .typescript/package-lock.json

      - name: Install dependencies
        working-directory: .typescript
        run: npm ci

      - name: Generate proto
        working-directory: .typescript
        run: npm run proto:gen

      - name: Run typecheck
        working-directory: .typescript
        run: npm run typecheck

      - name: Run tests
        working-directory: .typescript
        run: npm run test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .typescript/package-lock.json

      - name: Install dependencies
        working-directory: .typescript
        run: npm ci

      - name: Generate proto
        working-directory: .typescript
        run: npm run proto:gen

      - name: Run ESLint
        working-directory: .typescript
        run: npm run lint