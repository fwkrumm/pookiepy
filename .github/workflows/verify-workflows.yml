name: Verify Workflows

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Check workflow syntax and expressions
        # actionlint-py does not yet recognize GitHub's self-repository syntax.
        run: >-
          uvx --from actionlint-py actionlint
          -ignore '^specifying action \x22\$/\.github/actions/[a-z-]+\x22 in invalid format because ref is missing\.'

      - name: Audit workflow security
        run: uvx zizmor .github