name: Weekly gRPC Compat

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 14:00 UTC (2 h after weekly-latest-python)
  workflow_dispatch:  # Allow manual trigger

# Only one run at a time; cancel stale in-progress run.
concurrency:
  group: weekly-grpc-compat
  cancel-in-progress: true

# Minimal token permissions.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: gRPC compat test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies (wider grpc range)
        run: |
          uv pip install --system --only-binary grpcio,grpcio-tools \
            -r requirements-weekly.txt coverage

      - name: Generate protobuf interfaces
        uses: ./.github/actions/generate-protobuf

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m

  integration-test:
    name: gRPC compat integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies (wider grpc range)
        run: |
          uv pip install --system --only-binary grpcio,grpcio-tools \
            -r requirements-weekly.txt

      - name: Generate protobuf interfaces
        uses: ./.github/actions/generate-protobuf
        with:
          include-custom: "true"

      - name: Run integration tests
        run: python tests/integration/run_integration_tests.py
