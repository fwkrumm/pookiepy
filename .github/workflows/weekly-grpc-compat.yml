name: Weekly gRPC Compat

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 14:00 UTC (2 h after weekly-latest-python)
  workflow_dispatch:  # Allow manual trigger

# Only one run at a time; cancel stale in-progress run.
concurrency:
  group: weekly-grpc-compat
  cancel-in-progress: true

# Minimal token permissions.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: gRPC compat test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies (wider grpc range)
        run: |
          uv pip install --system --only-binary grpcio,grpcio-tools \
            -r requirements-weekly.txt coverage

      - name: Generate proto
        run: >-
          python -m grpc_tools.protoc -I. --python_out=.
          --grpc_python_out=. --pyi_out=. pookiepy/message.proto

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m

  integration-test:
    name: gRPC compat integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies (wider grpc range)
        run: |
          uv pip install --system --only-binary grpcio,grpcio-tools \
            -r requirements-weekly.txt

      - name: Generate bundled protobuf interface
        run: >-
          python -m grpc_tools.protoc -I. --python_out=.
          --grpc_python_out=. --pyi_out=. pookiepy/message.proto

      - name: Generate custom integration interface
        run: >-
          python -m grpc_tools.protoc -Itests/integration/custom_interface
          --python_out=tests/integration/custom_interface
          --grpc_python_out=tests/integration/custom_interface
          --pyi_out=tests/integration/custom_interface
          tests/integration/custom_interface/custom_if/message.proto

      - name: Run integration tests
        run: python tests/integration/run_integration_tests.py
