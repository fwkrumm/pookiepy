name: Weekly gRPC Compat

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 14:00 UTC (2 h after weekly-latest-python)
  workflow_dispatch:  # Allow manual trigger

# Only one run at a time; cancel stale in-progress run.
concurrency:
  group: weekly-grpc-compat
  cancel-in-progress: true

# Minimal token permissions.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: gRPC compat test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.x' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run core unit tests
        uses: ./.github/actions/python-check
        with:
          python-version: ${{ matrix.python-version }}
          suite: unit
          requirements: requirements-weekly.txt

  unit-test-examples:
    name: Unit test examples (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.x' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run example unit tests
        uses: ./.github/actions/python-check
        with:
          python-version: ${{ matrix.python-version }}
          suite: examples
          requirements: requirements-weekly.txt

  integration-test:
    name: gRPC compat integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run integration tests
        uses: ./.github/actions/python-check
        with:
          python-version: '3.x'
          suite: integration
          requirements: requirements-weekly.txt
