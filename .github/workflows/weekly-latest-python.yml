name: Weekly Latest Python Check

on:
  schedule:
    - cron: '0 12 * * 1' # Every Monday at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

# Only one weekly run at a time; cancel any stale in-progress run.
concurrency:
  group: weekly-latest-python
  cancel-in-progress: true

# Minimal token permissions.
permissions:
  contents: read

jobs:
  test:
    # Non-blocking probe for the newest stable Python release.
    name: Test (latest Python / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run core unit tests
        uses: $/.github/actions/python-check
        with:
          python-version: '3.x'
          suite: unit

  unit-test-examples:
    name: Unit test examples (latest Python / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run example unit tests
        uses: $/.github/actions/python-check
        with:
          python-version: '3.x'
          suite: examples

  lint:
    name: Pylint (latest Python)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Pylint
        uses: $/.github/actions/python-check
        with:
          python-version: '3.x'
          suite: lint
