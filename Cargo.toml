[package]
name = "grpchook-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = "0.10"
prost = "0.12"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5.4"
uuid = { version = "1.4", features = ["v4"] }
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.10"