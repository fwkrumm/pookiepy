[package]
name = "grpchook-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tonic = { version = "0.10", default-features = false, features = ["transport", "codegen", "prost"] }
prost = "0.12"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dashmap = "5.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
tokio-stream = "0.1"

# Build dependencies for proto code generation
tonic-build = "0.10"
tonic-reflect = "0.10"

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "grpchook-server"
path = "src/server_main.rs"
